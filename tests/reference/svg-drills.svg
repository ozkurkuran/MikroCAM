<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="50mm" viewBox="0 0 100 50">
  <title>Original MikroCAM analytic drill evidence fixture, MIT</title>
  <desc>Authored test artwork, not exported by Proteus. Three holes at 15,13;25,13;35,13 mm.</desc>
  <g transform="translate(5 3)">
    <g fill="black">
      <circle id="pad-a" cx="10" cy="10" r="2"/>
      <circle id="pad-b" cx="20" cy="10" r="2"/>
      <circle id="pad-c" cx="30" cy="10" r="2"/>
      <circle id="square-pad" cx="40" cy="10" r="2"/>
    </g>
    <g color="white" fill="currentColor" stroke="none">
      <circle id="hole-a" cx="10" cy="10" r=".4"/>
      <path id="hole-b" d="M19.6 10 A.4 .4 0 1 0 20.4 10 A.4 .4 0 1 0 19.6 10 Z"/>
      <circle id="hole-c" cx="30" cy="10" r=".6"/>
      <circle id="duplicate-a" cx="10" cy="10" r=".4"/>
      <rect id="square-not-hole" x="39.6" y="9.6" width=".8" height=".8"/>
      <circle id="isolated-white" cx="65" cy="10" r=".4"/>
      <circle id="hidden-white" cx="30" cy="10" r="1" visibility="hidden"/>
    </g>
  </g>
</svg>
